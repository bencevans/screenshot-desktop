name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 25.x]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - name: Install Linux capture tools
        run: sudo apt-get update && sudo apt-get install -y x11-xserver-utils imagemagick scrot xvfb xauth
        if: runner.os == 'Linux'
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Run macOS tests
        if: runner.os == 'macOS'
        run: npm test -- "test/**/*.js"
      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' npm test
      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: npm test
      - name: Verify native Linux cleanup
        if: runner.os == 'Linux'
        env:
          SCREENSHOT_NATIVE_CLEANUP: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' npm test -- test/native-cleanup.js
      - name: Verify native Windows cleanup
        if: runner.os == 'Windows'
        env:
          SCREENSHOT_NATIVE_CLEANUP: '1'
        run: npm test -- test/native-cleanup.js
